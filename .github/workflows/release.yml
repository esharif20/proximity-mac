name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: scripts/bundle.sh
      - name: Zip the app
        run: ditto -c -k --keepParent "dist/Proximity Mac.app" "dist/Proximity-Mac-${GITHUB_REF_NAME}.zip"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Proximity-Mac-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
